name: Python Package

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-riscv, windows-latest, windows-11-arm, macos-latest]
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
          - "pypy-3.10"
          - "pypy-3.11"
        exclude:
          - os: macos-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "pypy-3.10"
          - os: windows-latest
            python-version: "pypy-3.11"
          - os: windows-11-arm
            python-version: "3.10"
          - os: windows-11-arm
            python-version: "pypy-3.10"
          - os: windows-11-arm
            python-version: "pypy-3.11"
          - os: ubuntu-24.04-riscv
            python-version: "3.10"
          - os: ubuntu-24.04-riscv
            python-version: "3.11"
          - os: ubuntu-24.04-riscv
            python-version: "pypy-3.10"
          - os: ubuntu-24.04-riscv
            python-version: "pypy-3.11"

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Use RISE Python Packaging registry for riscv wheels
        if: matrix.os == 'ubuntu-24.04-riscv'
        run: |
          echo "UV_INDEX=https://pypi.riseproject.dev/simple/" >> "$GITHUB_ENV"
          echo "UV_INDEX_STRATEGY=unsafe-best-match" >> "$GITHUB_ENV"
          echo "UV_ONLY_BINARY_FLAGS=--only-binary cffi" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # uv defaults to the emulated x86_64 interpreter on Windows ARM64
          # unless the native arch is requested explicitly.
          python-version: ${{ matrix.os == 'windows-11-arm' && format('{0}-aarch64', matrix.python-version) || matrix.python-version }}
          activate-environment: true
      - name: Install requirements
        run: uv pip install numpy pytest
      - name: "Workaround: Generate _soundfile.py explicitly"
        run: |
          uv pip install cffi>=1.0 $UV_ONLY_BINARY_FLAGS
          python soundfile_build.py
      - name: Install editable package
        run: uv pip install --editable . --verbose $UV_ONLY_BINARY_FLAGS
      - name: Run tests
        run: python -m pytest

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install requirements
        run: uv pip install numpy pytest pyright
      - name: "Workaround: Generate _soundfile.py explicitly"
        run: |
          uv pip install cffi>=1.0
          python soundfile_build.py
      - name: Install editable package
        run: uv pip install --editable . --verbose
      - name: Run type check
        run: python -m pyright soundfile.py
